<template>
    <lightning-card class="apps-card">
        <div slot="title" class="card-title">
            <span class="card-title-icon" aria-hidden="true">
                <lightning-icon icon-name="utility:file" size="small" alternative-text=""></lightning-icon>
            </span>
            <span class="card-title-text">Applications</span>
        </div>
        <div slot="actions" class="slds-text-body_small slds-text-color_weak slds-m-right_small">
            {recordCountLabel}
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <div class="slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-end">
                <div class="slds-col slds-grow-none">
                    <template for:each={filterButtons} for:item="btn">
                        <button
                            key={btn.key}
                            type="button"
                            class={btn.className}
                            data-key={btn.key}
                            onclick={handleFilter}
                        >
                            {btn.label}
                        </button>
                    </template>
                </div>
                <div class="slds-col slds-grow">
                    <lightning-input
                        type="search"
                        label="Search"
                        variant="label-hidden"
                        placeholder="Search application, provider, or path"
                        value={draftSearch}
                        onchange={handleSearchChange}
                        onkeyup={handleSearchKeyup}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-grow-none">
                    <lightning-button label="Search" onclick={handleSearch}></lightning-button>
                </div>
            </div>
        </div>

        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={errorMessage}>
            <div class="slds-p-around_medium slds-text-color_error">{errorMessage}</div>
        </template>

        <template if:false={isLoading}>
            <template if:false={errorMessage}>
                <div class="slds-p-horizontal_small slds-p-bottom_small">
                    <lightning-datatable
                        key-field="id"
                        data={applications}
                        columns={columns}
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        onsort={handleSort}
                        hide-checkbox-column
                    ></lightning-datatable>
                </div>
            </template>
        </template>
    </lightning-card>
</template>
