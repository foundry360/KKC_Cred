<template>
    <article class="panel-card">
        <template if:true={isLoading}>
            <div class="panel-loading slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={errorMessage}>
            <div class="panel-error">{errorMessage}</div>
        </template>

        <template if:true={provider}>
            <div class="panel-body">
                <div class="slds-m-bottom_medium">
                    <div class="title-row">
                        <h1 class="provider-name slds-m-right_small">{provider.name}</h1>
                        <span class="slds-badge slds-m-right_xx-small">{provider.subjectType}</span>
                        <span class="slds-badge slds-theme_success">{provider.status}</span>
                        <div class="title-actions">
                            <lightning-button
                                label="Delete"
                                variant="destructive-text"
                                icon-name="utility:delete"
                                onclick={handleDelete}
                                disabled={deleting}
                            ></lightning-button>
                        </div>
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{subtitle}</p>
                </div>

                <div class="slds-grid slds-wrap slds-gutters_small">
                    <template for:each={fields} for:item="field">
                        <div key={field.key} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                            <div class="slds-text-title_caps slds-text-color_weak">{field.label}</div>
                            <div class="slds-text-body_regular">{field.value}</div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </article>
</template>
